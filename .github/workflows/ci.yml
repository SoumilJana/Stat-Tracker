name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Lint, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Tests and build only need these to exist; real values live in Vercel.
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-placeholder
      VITE_VAPID_PUBLIC_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Version files in sync
        run: node ../scripts/release.mjs check

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Type-check & build
        run: npm run build

  migrations:
    name: Migration files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migration names are unique and timestamp-ordered
        run: |
          cd supabase/migrations
          dupes=$(ls *.sql | sed -E 's/_.*//' | sort | uniq -d)
          if [ -n "$dupes" ]; then echo "Duplicate migration versions: $dupes"; exit 1; fi
          echo "✓ $(ls *.sql | wc -l) migrations, no duplicate versions"
